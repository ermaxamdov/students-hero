name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release assets
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install icon build dependency
        run: python -m pip install Pillow

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $expected = $env:RELEASE_TAG.TrimStart('v')
          $rootVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerVersion = (Get-Content installer/app/package.json -Raw | ConvertFrom-Json).version
          if ($rootVersion -ne $expected -or $installerVersion -ne $expected) {
            throw "Release tag must match package versions. Tag: $expected; root: $rootVersion; installer: $installerVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Build release assets
        run: npm run package:release

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" `
            release/StudentHero-Setup.exe `
            release/StudentHero-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber
